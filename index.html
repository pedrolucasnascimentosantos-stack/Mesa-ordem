<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ordo Realitas - Ficha de Agente</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans pb-12">

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDFOUP4HtzGXCeKJe_35ejjLVhX49uf2bY",
      authDomain: "ordem-rpg-mesa.firebaseapp.com",
      databaseURL: "https://ordem-rpg-mesa-default-rtdb.firebaseio.com",
      projectId: "ordem-rpg-mesa",
      storageBucket: "ordem-rpg-mesa.firebasestorage.app",
      messagingSenderId: "316057013081",
      appId: "1:316057013081:web:5b912840c0e62f085b5a48"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const LISTA_PERICIAS = [
      { nome: "Acrobacia", attr: "AGI" },
      { nome: "Adestramento", attr: "PRE" },
      { nome: "Artes", attr: "PRE" },
      { nome: "Atletismo", attr: "FOR" },
      { nome: "Atualidades", attr: "INT" },
      { nome: "Ciências", attr: "INT" },
      { nome: "Crime", attr: "AGI" },
      { nome: "Diplomacia", attr: "PRE" },
      { nome: "Enganação", attr: "PRE" },
      { nome: "Fortitude", attr: "VIG" },
      { nome: "Furtividade", attr: "AGI" },
      { nome: "Iniciativa", attr: "AGI" },
      { nome: "Intimidação", attr: "PRE" },
      { nome: "Intuição", attr: "PRE" },
      { nome: "Investigação", attr: "INT" },
      { nome: "Luta", attr: "FOR" },
      { nome: "Medicina", attr: "INT" },
      { nome: "Ocultismo", attr: "INT" },
      { nome: "Percepção", attr: "PRE" },
      { nome: "Pilotagem", attr: "AGI" },
      { nome: "Pontaria", attr: "AGI" },
      { nome: "Profissão", attr: "INT" },
      { nome: "Reflexos", attr: "AGI" },
      { nome: "Religião", attr: "PRE" },
      { nome: "Sobrevivência", attr: "INT" },
      { nome: "Tática", attr: "INT" },
      { nome: "Tecnologia", attr: "INT" },
      { nome: "Vontade", attr: "PRE" }
    ];
  </script>

  <!-- Barra de Navegação Superior -->
  <header class="bg-zinc-900 border-b border-zinc-800 p-4 sticky top-0 z-50 shadow-md">
    <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <span class="text-amber-500 font-bold tracking-widest text-lg">ORDO REALITAS</span>
        <div class="flex items-center bg-zinc-950 border border-zinc-700 rounded px-2 py-1 text-sm">
          <span class="text-zinc-500 mr-2 text-xs">SALA:</span>
          <input id="roomInput" type="text" value="novo-nilo" class="bg-transparent font-mono uppercase text-amber-400 focus:outline-none w-28 text-sm" />
          <button onclick="conectarSala()" class="ml-2 text-xs bg-zinc-800 hover:bg-zinc-700 px-2 py-0.5 rounded text-zinc-300">Entrar</button>
        </div>
      </div>

      <div class="flex items-center gap-2 overflow-x-auto" id="personagensBar"></div>

      <div class="flex items-center gap-2">
        <button onclick="criarNovoPersonagem()" class="bg-amber-600 hover:bg-amber-500 text-black font-semibold text-xs px-3 py-1.5 rounded transition">
          + Novo Agente
        </button>
        <button onclick="excluirPersonagemAtual()" class="bg-red-950 hover:bg-red-900 text-red-400 border border-red-800 font-semibold text-xs px-3 py-1.5 rounded transition">
          Excluir Agente
        </button>
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="max-w-6xl mx-auto p-4 space-y-6" id="fichaConteudo">
    <div class="text-center py-20 text-zinc-500">A carregar dados da mesa...</div>
  </main>

  <script>
    let salaAtual = "novo-nilo";
    let personagemIdAtual = null;
    let dadosSala = {};
    let abaAtiva = "principal";

    function conectarSala() {
      const input = document.getElementById("roomInput").value.trim().toLowerCase() || "novo-nilo";
      salaAtual = input;
      ouvirDados();
    }

    function mudarAba(aba) {
      abaAtiva = aba;
      renderizarFicha();
    }

    function ouvirDados() {
      db.ref("mesas/" + salaAtual).on("value", (snapshot) => {
        dadosSala = snapshot.val() || {};
        const chaves = Object.keys(dadosSala);
        
        if (chaves.length === 0) {
          criarNovoPersonagem("Agente 01");
          return;
        }

        if (!personagemIdAtual || !dadosSala[personagemIdAtual]) {
          personagemIdAtual = chaves[0];
        }

        renderizarBarraPersonagens(chaves);
        renderizarFicha();
      });
    }

    function renderizarBarraPersonagens(chaves) {
      const container = document.getElementById("personagensBar");
      container.innerHTML = "";
      chaves.forEach(id => {
        const p = dadosSala[id];
        const ativo = id === personagemIdAtual;
        const btn = document.createElement("button");
        btn.className = `px-3 py-1 rounded text-xs font-semibold border transition ${
          ativo ? "bg-amber-500 text-black border-amber-400 shadow" : "bg-zinc-800 text-zinc-300 border-zinc-700 hover:bg-zinc-700"
        }`;
        btn.innerText = p.nome || "Sem Nome";
        btn.onclick = () => {
          personagemIdAtual = id;
          renderizarBarraPersonagens(chaves);
          renderizarFicha();
        };
        container.appendChild(btn);
      });
    }

    function renderizarFicha() {
      const p = dadosSala[personagemIdAtual];
      if (!p) return;

      const forca = (p.atributos && p.atributos['FOR']) !== undefined ? p.atributos['FOR'] : 1;
      const cargaMaxima = Math.max(2, forca * 5);
      
      const itensArray = p.itens ? Object.entries(p.itens) : [];
      const cargaAtual = itensArray.reduce((acc, [_, item]) => acc + (parseFloat(item.espacos) || 0), 0);

      const armasArray = p.armas ? Object.entries(p.armas) : [];

      const main = document.getElementById("fichaConteudo");
      main.innerHTML = `
        <!-- Seletor de Abas -->
        <div class="flex border-b border-zinc-800 gap-2 pb-2">
          <button onclick="mudarAba('principal')" class="px-4 py-1.5 rounded text-xs font-bold uppercase transition ${abaAtiva === 'principal' ? 'bg-amber-500 text-black' : 'bg-zinc-900 text-zinc-400 hover:text-zinc-200'}">Ficha & Combate</button>
          <button onclick="mudarAba('pericias')" class="px-4 py-1.5 rounded text-xs font-bold uppercase transition ${abaAtiva === 'pericias' ? 'bg-amber-500 text-black' : 'bg-zinc-900 text-zinc-400 hover:text-zinc-200'}">Perícias (28)</button>
          <button onclick="mudarAba('historia')" class="px-4 py-1.5 rounded text-xs font-bold uppercase transition ${abaAtiva === 'historia' ? 'bg-amber-500 text-black' : 'bg-zinc-900 text-zinc-400 hover:text-zinc-200'}">História & Descrição</button>
        </div>

        <!-- ABA 1: PRINCIPAL, ARMAS & INVENTÁRIO -->
        <div class="${abaAtiva === 'principal' ? 'block' : 'hidden'} space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- Identificação -->
            <div class="bg-zinc-900 border border-zinc-800 rounded p-4 space-y-3">
              <h2 class="text-amber-500 font-bold border-b border-zinc-800 pb-1 text-sm uppercase">Identificação</h2>
              <div>
                <label class="text-xs text-zinc-500">Nome do Agente</label>
                <input type="text" value="${p.nome || ''}" onchange="atualizarCampo('nome', this.value)" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-sm text-zinc-100" />
              </div>
              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="text-xs text-zinc-500">Classe</label>
                  <input type="text" value="${p.classe || 'Combatente'}" onchange="atualizarCampo('classe', this.value)" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-sm" />
                </div>
                <div>
                  <label class="text-xs text-zinc-500">NEX (%)</label>
                  <input type="text" value="${p.nex || '5%'}" onchange="atualizarCampo('nex', this.value)" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-sm" />
                </div>
              </div>
              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="text-xs text-zinc-500">Patente</label>
                  <input type="text" value="${p.patente || 'Recruta'}" onchange="atualizarCampo('patente', this.value)" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-sm" />
                </div>
                <div>
                  <label class="text-xs text-zinc-500">Limite de Crédito</label>
                  <input type="text" value="${p.credito || 'Baixo'}" onchange="atualizarCampo('credito', this.value)" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-sm" />
                </div>
              </div>
            </div>

            <!-- Pontos Vitais -->
            <div class="bg-zinc-900 border border-zinc-800 rounded p-4 space-y-4">
              <h2 class="text-amber-500 font-bold border-b border-zinc-800 pb-1 text-sm uppercase">Pontos Vitais (Em Tempo Real)</h2>
              <div>
                <div class="flex justify-between text-xs font-semibold mb-1">
                  <span class="text-red-400">PONTOS DE VIDA (PV)</span>
                  <span>${p.pvAtual || 0} / ${p.pvMax || 20}</span>
                </div>
                <div class="flex gap-2">
                  <input type="number" value="${p.pvAtual || 0}" onchange="atualizarCampo('pvAtual', parseInt(this.value))" class="w-1/2 bg-zinc-950 border border-red-900/50 rounded p-1.5 text-center text-red-300 font-bold text-base" />
                  <input type="number" value="${p.pvMax || 20}" onchange="atualizarCampo('pvMax', parseInt(this.value))" class="w-1/2 bg-zinc-950 border border-zinc-800 rounded p-1.5 text-center text-xs text-zinc-400" />
                </div>
              </div>
              <div>
                <div class="flex justify-between text-xs font-semibold mb-1">
                  <span class="text-blue-400">SANIDADE (SAN)</span>
                  <span>${p.sanAtual || 0} / ${p.sanMax || 16}</span>
                </div>
                <div class="flex gap-2">
                  <input type="number" value="${p.sanAtual || 0}" onchange="atualizarCampo('sanAtual', parseInt(this.value))" class="w-1/2 bg-zinc-950 border border-blue-900/50 rounded p-1.5 text-center text-blue-300 font-bold text-base" />
                  <input type="number" value="${p.sanMax || 16}" onchange="atualizarCampo('sanMax', parseInt(this.value))" class="w-1/2 bg-zinc-950 border border-zinc-800 rounded p-1.5 text-center text-xs text-zinc-400" />
                </div>
              </div>
              <div>
                <div class="flex justify-between text-xs font-semibold mb-1">
                  <span class="text-amber-400">ESFORÇO (PE)</span>
                  <span>${p.peAtual || 0} / ${p.peMax || 4}</span>
                </div>
                <div class="flex gap-2">
                  <input type="number" value="${p.peAtual || 0}" onchange="atualizarCampo('peAtual', parseInt(this.value))" class="w-1/2 bg-zinc-950 border border-amber-900/50 rounded p-1.5 text-center text-amber-300 font-bold text-base" />
                  <input type="number" value="${p.peMax || 4}" onchange="atualizarCampo('peMax', parseInt(this.value))" class="w-1/2 bg-zinc-950 border border-zinc-800 rounded p-1.5 text-center text-xs text-zinc-400" />
                </div>
              </div>
            </div>

            <!-- Atributos -->
            <div class="bg-zinc-900 border border-zinc-800 rounded p-4">
              <h2 class="text-amber-500 font-bold border-b border-zinc-800 pb-1 text-sm uppercase mb-3">Atributos</h2>
              <div class="grid grid-cols-5 gap-1 text-center">
                ${['AGI', 'FOR', 'INT', 'PRE', 'VIG'].map(attr => `
                  <div class="bg-zinc-950 p-2 rounded border border-zinc-800">
                    <span class="text-[10px] text-zinc-500 font-bold block">${attr}</span>
                    <input type="number" value="${(p.atributos && p.atributos[attr]) !== undefined ? p.atributos[attr] : 1}" onchange="atualizarAtributo('${attr}', parseInt(this.value))" class="w-full bg-transparent text-center font-bold text-amber-400 text-base focus:outline-none" />
                  </div>
                `).join('')}
              </div>
              <div class="mt-4">
                <label class="text-xs text-zinc-500">Defesa Passiva</label>
                <input type="number" value="${p.defesa || 10}" onchange="atualizarCampo('defesa', parseInt(this.value))" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-sm text-center font-bold text-zinc-200" />
              </div>
            </div>

            <!-- Bloco de Armas & Ataques -->
            <div class="md:col-span-3 bg-zinc-900 border border-zinc-800 rounded p-4 space-y-4">
              <div class="flex items-center justify-between border-b border-zinc-800 pb-2">
                <h2 class="text-amber-500 font-bold text-sm uppercase">Armas & Ataques</h2>
                <button onclick="adicionarArma()" class="bg-amber-600 hover:bg-amber-500 text-black text-xs font-semibold px-2.5 py-1 rounded transition">
                  + Nova Arma
                </button>
              </div>

              <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                  <thead>
                    <tr class="text-zinc-500 border-b border-zinc-800 font-mono uppercase">
                      <th class="pb-2 w-1/4">Arma / Ataque</th>
                      <th class="pb-2 w-28">Teste / Perícia</th>
                      <th class="pb-2 w-20">Dano</th>
                      <th class="pb-2 w-20">Crítico</th>
                      <th class="pb-2 w-24">Alcance</th>
                      <th class="pb-2">Especial / Tipo</th>
                      <th class="pb-2 w-10 text-center">Ação</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-zinc-800/60">
                    ${armasArray.length === 0 ? `
                      <tr>
                        <td colspan="7" class="py-6 text-center text-zinc-600">Nenhuma arma registada.</td>
                      </tr>
                    ` : armasArray.map(([idArma, arma]) => `
                      <tr>
                        <td class="py-2 pr-2">
                          <input type="text" value="${arma.nome || ''}" onchange="atualizarArma('${idArma}', 'nome', this.value)" placeholder="Ex: Revólver .38" class="w-full bg-zinc-950 border border-zinc-800 rounded px-2 py-1 text-zinc-200 font-medium" />
                        </td>
                        <td class="py-2 px-1">
                          <input type="text" value="${arma.teste || ''}" onchange="atualizarArma('${idArma}', 'teste', this.value)" placeholder="Pontaria (2d20)" class="w-full bg-zinc-950 border border-zinc-800 rounded px-1.5 py-1 text-zinc-300" />
                        </td>
                        <td class="py-2 px-1">
                          <input type="text" value="${arma.dano || ''}" onchange="atualizarArma('${idArma}', 'dano', this.value)" placeholder="2d6" class="w-full bg-zinc-950 border border-zinc-800 rounded px-1.5 py-1 text-zinc-200" />
                        </td>
                        <td class="py-2 px-1">
                          <input type="text" value="${arma.critico || ''}" onchange="atualizarArma('${idArma}', 'critico', this.value)" placeholder="19/x3" class="w-full bg-zinc-950 border border-zinc-800 rounded px-1.5 py-1 text-zinc-200" />
                        </td>
                        <td class="py-2 px-1">
                          <input type="text" value="${arma.alcance || ''}" onchange="atualizarArma('${idArma}', 'alcance', this.value)" placeholder="Curto / Médio" class="w-full bg-zinc-950 border border-zinc-800 rounded px-1.5 py-1 text-zinc-400" />
                        </td>
                        <td class="py-2 px-1">
                          <input type="text" value="${arma.especial || ''}" onchange="atualizarArma('${idArma}', 'especial', this.value)" placeholder="Balístico, Recarga rápida..." class="w-full bg-zinc-950 border border-zinc-800 rounded px-2 py-1 text-zinc-400" />
                        </td>
                        <td class="py-2 text-center">
                          <button onclick="removerArma('${idArma}')" class="text-red-500 hover:text-red-400 font-bold px-2 py-1">✕</button>
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>

            <!-- Inventário & Carga -->
            <div class="md:col-span-3 bg-zinc-900 border border-zinc-800 rounded p-4 space-y-4">
              <div class="flex flex-wrap items-center justify-between border-b border-zinc-800 pb-2 gap-2">
                <div class="flex items-center gap-3">
                  <h2 class="text-amber-500 font-bold text-sm uppercase">Inventário & Carga</h2>
                  <span class="text-xs px-2 py-0.5 rounded font-mono ${cargaAtual > cargaMaxima ? 'bg-red-950 text-red-400 border border-red-800' : 'bg-zinc-800 text-zinc-300'}">
                    Carga: ${cargaAtual} / ${cargaMaxima} espaços
                  </span>
                </div>
                <button onclick="adicionarItem()" class="bg-amber-600 hover:bg-amber-500 text-black text-xs font-semibold px-2.5 py-1 rounded transition">
                  + Adicionar Item
                </button>
              </div>

              <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                  <thead>
                    <tr class="text-zinc-500 border-b border-zinc-800 font-mono uppercase">
                      <th class="pb-2 w-1/3">Item</th>
                      <th class="pb-2 w-20 text-center">Categoria</th>
                      <th class="pb-2 w-16 text-center">Espaços</th>
                      <th class="pb-2">Detalhes / Descrição</th>
                      <th class="pb-2 w-10 text-center">Ação</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-zinc-800/60">
                    ${itensArray.length === 0 ? `
                      <tr>
                        <td colspan="5" class="py-6 text-center text-zinc-600">Nenhum item adicionado ao inventário.</td>
                      </tr>
                    ` : itensArray.map(([idItem, item]) => `
                      <tr>
                        <td class="py-2 pr-2">
                          <input type="text" value="${item.nome || ''}" onchange="atualizarItem('${idItem}', 'nome', this.value)" placeholder="Nome do item" class="w-full bg-zinc-950 border border-zinc-800 rounded px-2 py-1 text-zinc-200 font-medium" />
                        </td>
                        <td class="py-2 px-1 text-center">
                          <select onchange="atualizarItem('${idItem}', 'categoria', this.value)" class="bg-zinc-950 border border-zinc-800 rounded px-1.5 py-1 text-zinc-300 w-full text-center">
                            <option value="0" ${item.categoria == '0' ? 'selected' : ''}>0</option>
                            <option value="I" ${item.categoria == 'I' ? 'selected' : ''}>I</option>
                            <option value="II" ${item.categoria == 'II' ? 'selected' : ''}>II</option>
                            <option value="III" ${item.categoria == 'III' ? 'selected' : ''}>III</option>
                            <option value="IV" ${item.categoria == 'IV' ? 'selected' : ''}>IV</option>
                          </select>
                        </td>
                        <td class="py-2 px-1 text-center">
                          <input type="number" step="0.5" value="${item.espacos !== undefined ? item.espacos : 1}" onchange="atualizarItem('${idItem}', 'espacos', parseFloat(this.value) || 0)" class="w-full bg-zinc-950 border border-zinc-800 rounded px-1.5 py-1 text-center text-zinc-200" />
                        </td>
                        <td class="py-2 px-2">
                          <input type="text" value="${item.detalhes || ''}" onchange="atualizarItem('${idItem}', 'detalhes', this.value)" placeholder="Dano, munição, efeitos..." class="w-full bg-zinc-950 border border-zinc-800 rounded px-2 py-1 text-zinc-400" />
                        </td>
                        <td class="py-2 text-center">
                          <button onclick="removerItem('${idItem}')" class="text-red-500 hover:text-red-400 font-bold px-2 py-1">✕</button>
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>

        <!-- ABA 2: PERÍCIAS (28 OFICIAIS) -->
        <div class="${abaAtiva === 'pericias' ? 'block' : 'hidden'} bg-zinc-900 border border-zinc-800 rounded p-4 space-y-4">
          <div class="flex items-center justify-between border-b border-zinc-800 pb-2">
            <div>
              <h2 class="text-amber-500 font-bold text-sm uppercase">Perícias de Agente</h2>
              <p class="text-xs text-zinc-500">Destreinado (+0), Treinado (+5), Veterano (+10), Expert (+15)</p>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
            ${LISTA_PERICIAS.map(pericia => {
              const dadosPericia = (p.pericias && p.pericias[pericia.nome]) || { grau: 0, bonus: 0 };
              const grauTreino = parseInt(dadosPericia.grau) || 0;
              const bonusExtra = parseInt(dadosPericia.bonus) || 0;
              const totalBonus = grauTreino + bonusExtra;
              const attrValor = (p.atributos && p.atributos[pericia.attr]) !== undefined ? p.atributos[pericia.attr] : 1;

              return `
                <div class="bg-zinc-950 border border-zinc-800/80 rounded p-2.5 flex items-center justify-between gap-2">
                  <div class="w-1/3">
                    <span class="text-xs font-semibold text-zinc-200 block truncate">${pericia.nome}</span>
                    <span class="text-[10px] text-amber-500 font-mono">${pericia.attr} (${attrValor}d20)</span>
                  </div>
                  <div class="flex items-center gap-1.5 w-2/3 justify-end">
                    <select onchange="atualizarPericia('${pericia.nome}', 'grau', parseInt(this.value))" class="bg-zinc-900 border border-zinc-700 rounded px-1.5 py-1 text-[11px] text-zinc-300">
                      <option value="0" ${grauTreino === 0 ? 'selected' : ''}>Destr. (+0)</option>
                      <option value="5" ${grauTreino === 5 ? 'selected' : ''}>Treinado (+5)</option>
                      <option value="10" ${grauTreino === 10 ? 'selected' : ''}>Veterano (+10)</option>
                      <option value="15" ${grauTreino === 15 ? 'selected' : ''}>Expert (+15)</option>
                    </select>
                    <input type="number" value="${bonusExtra}" placeholder="+0" onchange="atualizarPericia('${pericia.nome}', 'bonus', parseInt(this.value) || 0)" title="Bónus Adicional / Itens" class="w-10 bg-zinc-900 border border-zinc-700 rounded px-1 py-1 text-center text-xs text-zinc-300" />
                    <span class="text-xs font-mono font-bold w-7 text-right ${totalBonus > 0 ? 'text-amber-400' : 'text-zinc-500'}">
                      +${totalBonus}
                    </span>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>

        <!-- ABA 3: HISTÓRIA & DESCRIÇÃO -->
        <div class="${abaAtiva === 'historia' ? 'block' : 'hidden'} bg-zinc-900 border border-zinc-800 rounded p-4 space-y-4">
          <h2 class="text-amber-500 font-bold border-b border-zinc-800 pb-1 text-sm uppercase">Descrição & Histórico do Agente</h2>
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="text-xs text-zinc-400 font-semibold block mb-1">Aparência</label>
              <textarea rows="3" onchange="atualizarCampo('aparencia', this.value)" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-xs text-zinc-300 focus:outline-none focus:border-amber-500" placeholder="Vestimenta, cicatrizes, traços marcantes...">${p.aparencia || ''}</textarea>
            </div>
            <div>
              <label class="text-xs text-zinc-400 font-semibold block mb-1">Personalidade</label>
              <textarea rows="3" onchange="atualizarCampo('personalidade', this.value)" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-xs text-zinc-300 focus:outline-none focus:border-amber-500" placeholder="Comportamento, manias, postura perante o paranormal...">${p.personalidade || ''}</textarea>
            </div>
            <div>
              <label class="text-xs text-zinc-400 font-semibold block mb-1">Histórico</label>
              <textarea rows="4" onchange="atualizarCampo('historico', this.value)" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-xs text-zinc-300 focus:outline-none focus:border-amber-500" placeholder="Origem, como foi recrutado pela Ordo Realitas...">${p.historico || ''}</textarea>
            </div>
            <div>
              <label class="text-xs text-zinc-400 font-semibold block mb-1">Objetivo Pessoal</label>
              <textarea rows="4" onchange="atualizarCampo('objetivo', this.value)" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-xs text-zinc-300 focus:outline-none focus:border-amber-500" placeholder="Motivação para continuar lutando contra o Outro Lado...">${p.objetivo || ''}</textarea>
            </div>
          </div>
        </div>
      `;
    }

    function atualizarCampo(campo, valor) {
      if (!personagemIdAtual) return;
      db.ref(`mesas/${salaAtual}/${personagemIdAtual}/${campo}`).set(valor);
    }

    function atualizarAtributo(attr, valor) {
      if (!personagemIdAtual) return;
      db.ref(`mesas/${salaAtual}/${personagemIdAtual}/atributos/${attr}`).set(valor);
    }

    function atualizarPericia(nomePericia, campo, valor) {
      if (!personagemIdAtual) return;
      db.ref(`mesas/${salaAtual}/${personagemIdAtual}/pericias/${nomePericia}/${campo}`).set(valor);
    }

    function adicionarItem() {
      if (!personagemIdAtual) return;
      const novoItemRef = db.ref(`mesas/${salaAtual}/${personagemIdAtual}/itens`).push();
      novoItemRef.set({
        nome: "Novo Item",
        categoria: "0",
        espacos: 1,
        detalhes: ""
      });
    }

    function atualizarItem(idItem, campo, valor) {
      if (!personagemIdAtual) return;
      db.ref(`mesas/${salaAtual}/${personagemIdAtual}/itens/${idItem}/${campo}`).set(valor);
    }

    function removerItem(idItem) {
      if (!personagemIdAtual) return;
      db.ref(`mesas/${salaAtual}/${personagemIdAtual}/itens/${idItem}`).remove();
    }

    function adicionarArma() {
      if (!personagemIdAtual) return;
      const novaArmaRef = db.ref(`mesas/${salaAtual}/${personagemIdAtual}/armas`).push();
      novaArmaRef.set({
        nome: "Nova Arma",
        teste: "Luta",
        dano: "1d6",
        critico: "20/x2",
        alcance: "Curto",
        especial: ""
      });
    }

    function atualizarArma(idArma, campo, valor) {
      if (!personagemIdAtual) return;
      db.ref(`mesas/${salaAtual}/${personagemIdAtual}/armas/${idArma}/${campo}`).set(valor);
    }

    function removerArma(idArma) {
      if (!personagemIdAtual) return;
      db.ref(`mesas/${salaAtual}/${personagemIdAtual}/armas/${idArma}`).remove();
    }

    function criarNovoPersonagem(nomePadrao = "Novo Agente") {
      const novoRef = db.ref(`mesas/${salaAtual}`).push();
      const itensIniciais = {
        item_1: { nome: "Vestimenta de Proteção Leve", categoria: "I", espacos: 2, detalhes: "+2 Defesa" },
        item_2: { nome: "Munição Curta (2x)", categoria: "I", espacos: 1, detalhes: "Recarga" },
        item_3: { nome: "Lanterna Tática", categoria: "0", espacos: 1, detalhes: "Ilumina alcance curto" }
      };

      const armasIniciais = {
        arma_1: { nome: "Revólver .38", teste: "Pontaria", dano: "2d6", critico: "19/x3", alcance: "Curto", especial: "Balístico" },
        arma_2: { nome: "Faca Tática", teste: "Luta", dano: "1d4+2", critico: "19/x2", alcance: "Corpo a corpo", especial: "Corte" }
      };

      novoRef.set({
        nome: nomePadrao,
        classe: "Combatente",
        nex: "5%",
        patente: "Recruta",
        credito: "Baixo",
        pvAtual: 20,
        pvMax: 20,
        sanAtual: 16,
        sanMax: 16,
        peAtual: 2,
        peMax: 2,
        defesa: 11,
        atributos: { AGI: 2, FOR: 2, INT: 1, PRE: 1, VIG: 2 },
        armas: armasIniciais,
        itens: itensIniciais,
        aparencia: "",
        personalidade: "",
        historico: "",
        objetivo: ""
      });
      personagemIdAtual = novoRef.key;
    }

    function excluirPersonagemAtual() {
      if (!personagemIdAtual) return;
      const p = dadosSala[personagemIdAtual];
      const nome = p ? p.nome : "este agente";
      if (confirm(`Tem a certeza de que deseja excluir permanentemente o agente "${nome}"?`)) {
        db.ref(`mesas/${salaAtual}/${personagemIdAtual}`).remove();
        personagemIdAtual = null;
      }
    }

    ouvirDados();
  </script>
</body>
</html>
