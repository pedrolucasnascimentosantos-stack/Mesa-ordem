<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ordo Realitas - Gestão de Mesa e Fichas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans pb-16">

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDFOUP4HtzGXCeKJe_35ejjLVhX49uf2bY",
      authDomain: "ordem-rpg-mesa.firebaseapp.com",
      databaseURL: "https://ordem-rpg-mesa-default-rtdb.firebaseio.com",
      projectId: "ordem-rpg-mesa",
      storageBucket: "ordem-rpg-mesa.firebasestorage.app",
      messagingSenderId: "316057013081",
      appId: "1:316057013081:web:5b912840c0e62f085b5a48"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const SENHA_MESTRE_PADRAO = "ordem123";

    const LISTA_PERICIAS = [
      { nome: "Acrobacia", attr: "AGI" },
      { nome: "Adestramento", attr: "PRE" },
      { nome: "Artes", attr: "PRE" },
      { nome: "Atletismo", attr: "FOR" },
      { nome: "Atualidades", attr: "INT" },
      { nome: "Ciências", attr: "INT" },
      { nome: "Crime", attr: "AGI" },
      { nome: "Diplomacia", attr: "PRE" },
      { nome: "Enganação", attr: "PRE" },
      { nome: "Fortitude", attr: "VIG" },
      { nome: "Furtividade", attr: "AGI" },
      { nome: "Iniciativa", attr: "AGI" },
      { nome: "Intimidação", attr: "PRE" },
      { nome: "Intuição", attr: "PRE" },
      { nome: "Investigação", attr: "INT" },
      { nome: "Luta", attr: "FOR" },
      { nome: "Medicina", attr: "INT" },
      { nome: "Ocultismo", attr: "INT" },
      { nome: "Percepção", attr: "PRE" },
      { nome: "Pilotagem", attr: "AGI" },
      { nome: "Pontaria", attr: "AGI" },
      { nome: "Profissão", attr: "INT" },
      { nome: "Reflexos", attr: "AGI" },
      { nome: "Religião", attr: "PRE" },
      { nome: "Sobrevivência", attr: "INT" },
      { nome: "Tática", attr: "INT" },
      { nome: "Tecnologia", attr: "INT" },
      { nome: "Vontade", attr: "PRE" }
    ];
  </script>

  <!-- Cabeçalho -->
  <header class="bg-zinc-900 border-b border-zinc-800 p-4 sticky top-0 z-50 shadow-md">
    <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <span class="text-amber-500 font-bold tracking-widest text-lg">ORDO REALITAS</span>
        <div class="flex items-center bg-zinc-950 border border-zinc-700 rounded px-2 py-1 text-sm">
          <span class="text-zinc-500 mr-2 text-xs">SALA:</span>
          <input id="roomInput" type="text" value="novo-nilo" class="bg-transparent font-mono uppercase text-amber-400 focus:outline-none w-28 text-sm" />
          <button onclick="conectarSala()" class="ml-2 text-xs bg-zinc-800 hover:bg-zinc-700 px-2 py-0.5 rounded text-zinc-300">Entrar</button>
        </div>
      </div>

      <div class="flex items-center gap-2 overflow-x-auto" id="personagensBar"></div>

      <div class="flex items-center gap-2">
        <button onclick="criarNovoPersonagem()" class="bg-amber-600 hover:bg-amber-500 text-black font-semibold text-xs px-3 py-1.5 rounded transition">
          + Novo Agente
        </button>
        <button onclick="excluirPersonagemAtual()" class="bg-red-950 hover:bg-red-900 text-red-400 border border-red-800 font-semibold text-xs px-3 py-1.5 rounded transition">
          Excluir Agente
        </button>
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="max-w-6xl mx-auto p-4 space-y-6" id="fichaConteudo">
    <div class="text-center py-20 text-zinc-500">A carregar dados da mesa...</div>
  </main>

  <script>
    let salaAtual = "novo-nilo";
    let personagemIdAtual = null;
    let dadosSala = {};
    let dadosCriaturas = {};
    let dadosDocumentos = {};
    let abaAtiva = "principal"; 
    let mestreAutenticado = false;

    function conectarSala() {
      const input = document.getElementById("roomInput").value.trim().toLowerCase() || "novo-nilo";
      salaAtual = input;
      ouvirDados();
    }

    function mudarAba(aba) {
      if ((aba === 'mestre' || aba === 'criaturas') && !mestreAutenticado) {
        solicitarSenhaMestre(aba);
        return;
      }
      abaAtiva = aba;
      renderizarFicha();
    }

    function solicitarSenhaMestre(abaDestino) {
      const tentativa = prompt("ÁREA RESTRITA DO MESTRE DA ORDO REALITAS.\nDigite a senha de acesso:");
      if (tentativa === SENHA_MESTRE_PADRAO) {
        mestreAutenticado = true;
        abaAtiva = abaDestino;
        renderizarFicha();
      } else if (tentativa !== null) {
        alert("Acesso Negado: Senha incorreta.");
      }
    }

    function bloquearMestre() {
      mestreAutenticado = false;
      abaAtiva = "principal";
      renderizarFicha();
      alert("Acesso do Mestre bloqueado.");
    }

    function ouvirDados() {
      db.ref("mesas/" + salaAtual).on("value", (snapshot) => {
        dadosSala = snapshot.val() || {};
        const chaves = Object.keys(dadosSala);
        
        if (chaves.length === 0) {
          criarNovoPersonagem("Agente 01");
          return;
        }

        if (!personagemIdAtual || !dadosSala[personagemIdAtual]) {
          personagemIdAtual = chaves[0];
        }

        renderizarBarraPersonagens(chaves);
        renderizarFicha();
      });

      db.ref("criaturas/" + salaAtual).on("value", (snapshot) => {
        dadosCriaturas = snapshot.val() || {};
        if (abaAtiva === 'criaturas') renderizarFicha();
      });

      db.ref("documentos/" + salaAtual).on("value", (snapshot) => {
        dadosDocumentos = snapshot.val() || {};
        if (abaAtiva === 'documentos') renderizarFicha();
      });
    }

    function renderizarBarraPersonagens(chaves) {
      const container = document.getElementById("personagensBar");
      container.innerHTML = "";
      chaves.forEach(id => {
        const p = dadosSala[id];
        const ativo = id === personagemIdAtual && !['mestre', 'criaturas', 'documentos'].includes(abaAtiva);
        const btn = document.createElement("button");
        btn.className = `px-3 py-1 rounded text-xs font-semibold border transition ${
          ativo ? "bg-amber-500 text-black border-amber-400 shadow" : "bg-zinc-800 text-zinc-300 border-zinc-700 hover:bg-zinc-700"
        }`;
        btn.innerText = p.nome || "Sem Nome";
        btn.onclick = () => {
          personagemIdAtual = id;
          if (['mestre', 'criaturas', 'documentos'].includes(abaAtiva)) abaAtiva = 'principal';
          renderizarBarraPersonagens(chaves);
          renderizarFicha();
        };
        container.appendChild(btn);
      });
    }

    function alterarStatusMestre(charId, campo, delta) {
      const atual = (dadosSala[charId] && dadosSala[charId][campo]) || 0;
      const novo = Math.max(0, atual + delta);
      db.ref(`mesas/${salaAtual}/${charId}/${campo}`).set(novo);
    }

    // Criaturas
    function criarCriatura() {
      const novaRef = db.ref(`criaturas/${salaAtual}`).push();
      novaRef.set({
        nome: "Zumbi de Sangue",
        elemento: "Sangue",
        vd: "20",
        tamanho: "Médio",
        pvAtual: 45,
        pvMax: 45,
        defesa: 15,
        rd: "Corte e Impacto 5",
        vulnerabilidade: "Morte",
        ataques: "Garras (2d20+5, 1d8+3 dano corte)",
        habilidades: "Presença Perturbadora (DT 15, 2d6 SAN)"
      });
    }

    function atualizarCriatura(id, campo, valor) {
      db.ref(`criaturas/${salaAtual}/${id}/${campo}`).set(valor);
    }

    function alterarPVCriatura(id, delta) {
      const atual = (dadosCriaturas[id] && dadosCriaturas[id].pvAtual) || 0;
      const novo = Math.max(0, atual + delta);
      db.ref(`criaturas/${salaAtual}/${id}/pvAtual`).set(novo);
    }

    function excluirCriatura(id) {
      const c = dadosCriaturas[id];
      if (confirm(`Excluir permanentemente "${c ? c.nome : 'esta criatura'}"?`)) {
        db.ref(`criaturas/${salaAtual}/${id}`).remove();
      }
    }

    // Documentos
    function fazerUploadDocumento(event) {
      const arquivo = event.target.files[0];
      if (!arquivo) return;
      if (arquivo.size > 2.5 * 1024 * 1024) {
        alert("O arquivo é muito grande. Escolha um arquivo de até 2.5MB.");
        return;
      }
      const leitor = new FileReader();
      leitor.onload = function(e) {
        const conteudoBase64 = e.target.result;
        const novoDocRef = db.ref(`documentos/${salaAtual}`).push();
        novoDocRef.set({
          nome: arquivo.name,
          tipo: arquivo.type || "application/octet-stream",
          tamanho: (arquivo.size / 1024).toFixed(1) + " KB",
          dados: conteudoBase64,
          dataEnvio: new Date().toLocaleDateString('pt-BR') + ' ' + new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})
        });
      };
      leitor.readAsDataURL(arquivo);
    }

    function excluirDocumento(id) {
      if (confirm("Excluir este documento?")) {
        db.ref(`documentos/${salaAtual}/${id}`).remove();
      }
    }

    // Rituais e Poderes
    function adicionarRitual() {
      if (!personagemIdAtual) return;
      db.ref(`mesas/${salaAtual}/${personagemIdAtual}/rituals`).push({ nome: "Novo Ritual", elemento: "Conhecimento", circulo: "1º", pe: "1", efeito: "Descrição..." });
    }
    function atualizarRitual(id, campo, valor) {
      if (!personagemIdAtual) return;
      db.ref(`mesas/${salaAtual}/${personagemIdAtual}/rituals/${id}/${campo}`).set(valor);
    }
    function removerRitual(id) {
      if (!personagemIdAtual) return;
      db.ref(`mesas/${salaAtual}/${personagemIdAtual}/rituals/${id}`).remove();
    }

    function adicionarPoder() {
      if (!personagemIdAtual) return;
      db.ref(`mesas/${salaAtual}/${personagemIdAtual}/powers`).push({ nome: "Novo Poder", desc: "Descrição..." });
    }
    function atualizarPoder(id, campo, valor) {
      if (!personagemIdAtual) return;
      db.ref(`mesas/${salaAtual}/${personagemIdAtual}/powers/${id}/${campo}`).set(valor);
    }
    function removerPoder(id) {
      if (!personagemIdAtual) return;
      db.ref(`mesas/${salaAtual}/${personagemIdAtual}/powers/${id}`).remove();
    }

    function renderizarFicha() {
      const p = dadosSala[personagemIdAtual];
      const chaves = Object.keys(dadosSala);
      const chavesCriaturas = Object.keys(dadosCriaturas);
      const chavesDocumentos = Object.keys(dadosDocumentos);

      const forca = (p && p.atributos && p.atributos['FOR']) !== undefined ? p.atributos['FOR'] : 1;
      const cargaMaxima = Math.max(2, forca * 5);
      const itensArray = (p && p.itens) ? Object.entries(p.itens) : [];
      const cargaAtual = itensArray.reduce((acc, [_, item]) => acc + (parseFloat(item.espacos) || 0), 0);
      const armasArray = (p && p.armas) ? Object.entries(p.armas) : [];
      const rituaisArray = (p && p.rituals) ? Object.entries(p.rituals) : [];
      const poderesArray = (p && p.powers) ? Object.entries(p.powers) : [];

      const main = document.getElementById("fichaConteudo");
      main.innerHTML = `
        <!-- Seletor de Abas -->
        <div class="flex flex-wrap items-center justify-between border-b border-zinc-800 gap-2 pb-2">
          <div class="flex flex-wrap gap-2">
            <button onclick="mudarAba('principal')" class="px-3.5 py-1.5 rounded text-xs font-bold uppercase transition ${abaAtiva === 'principal' ? 'bg-amber-500 text-black' : 'bg-zinc-900 text-zinc-400 hover:text-zinc-200'}">Ficha & Combate</button>
            <button onclick="mudarAba('pericias')" class="px-3.5 py-1.5 rounded text-xs font-bold uppercase transition ${abaAtiva === 'pericias' ? 'bg-amber-500 text-black' : 'bg-zinc-900 text-zinc-400 hover:text-zinc-200'}">Perícias (28)</button>
            <button onclick="mudarAba('rituais')" class="px-3.5 py-1.5 rounded text-xs font-bold uppercase transition ${abaAtiva === 'rituais' ? 'bg-amber-500 text-black' : 'bg-zinc-900 text-zinc-400 hover:text-zinc-200'}">Rituais & Poderes</button>
            <button onclick="mudarAba('historia')" class="px-3.5 py-1.5 rounded text-xs font-bold uppercase transition ${abaAtiva === 'historia' ? 'bg-amber-500 text-black' : 'bg-zinc-900 text-zinc-400 hover:text-zinc-200'}">História & Descrição</button>
            <button onclick="mudarAba('documentos')" class="px-3.5 py-1.5 rounded text-xs font-bold uppercase transition flex items-center gap-1 ${abaAtiva === 'documentos' ? 'bg-cyan-600 text-black font-extrabold shadow' : 'bg-zinc-900 text-cyan-400 hover:bg-zinc-800'}">
              <span>📂</span> Documentos
            </button>
            <button onclick="mudarAba('mestre')" class="px-3.5 py-1.5 rounded text-xs font-bold uppercase transition flex items-center gap-1.5 ${abaAtiva === 'mestre' ? 'bg-red-600 text-white shadow-lg' : 'bg-zinc-900 text-red-400 hover:bg-zinc-800'}">
              <span>${mestreAutenticado ? '🔓' : '🔒'}</span> Escudo do Mestre
            </button>
            <button onclick="mudarAba('criaturas')" class="px-3.5 py-1.5 rounded text-xs font-bold uppercase transition flex items-center gap-1.5 ${abaAtiva === 'criaturas' ? 'bg-purple-600 text-white shadow-lg' : 'bg-zinc-900 text-purple-400 hover:bg-zinc-800'}">
              <span>${mestreAutenticado ? '🔓' : '🔒'}</span> Ameaças
            </button>
          </div>

          ${mestreAutenticado ? `
            <button onclick="bloquearMestre()" class="text-[11px] bg-zinc-900 border border-zinc-700 hover:bg-zinc-800 text-zinc-400 px-2.5 py-1 rounded">
              🔒 Bloquear Mestre
            </button>
          ` : ''}
        </div>

        <!-- ABA RITUAIS & PODERES -->
        <div class="${abaAtiva === 'rituais' ? 'block' : 'hidden'} space-y-6">
          <div class="bg-zinc-900 border border-zinc-800 rounded p-4 space-y-4">
            <div class="flex items-center justify-between border-b border-zinc-800 pb-2">
              <h2 class="text-amber-500 font-bold text-sm uppercase">Rituais Paranormais</h2>
              <button onclick="adicionarRitual()" class="bg-amber-600 hover:bg-amber-500 text-black text-xs font-semibold px-2.5 py-1 rounded transition">+ Novo Ritual</button>
            </div>
            <div class="space-y-3">
              ${rituaisArray.length === 0 ? `
                <div class="text-center py-6 text-zinc-600 text-xs">Nenhum ritual registado.</div>
              ` : rituaisArray.map(([idR, r]) => `
                <div class="bg-zinc-950 border border-zinc-800 rounded p-3 space-y-2">
                  <div class="grid grid-cols-1 sm:grid-cols-4 gap-2">
                    <input type="text" value="${r.nome || ''}" onchange="atualizarRitual('${idR}', 'nome', this.value)" placeholder="Nome" class="bg-zinc-900 border border-zinc-800 rounded px-2 py-1 text-xs text-zinc-200 font-bold" />
                    <select onchange="atualizarRitual('${idR}', 'elemento', this.value)" class="bg-zinc-900 border border-zinc-800 rounded px-2 py-1 text-xs text-zinc-300">
                      <option value="Conhecimento" ${r.elemento === 'Conhecimento' ? 'selected' : ''}>Conhecimento</option>
                      <option value="Energia" ${r.elemento === 'Energia' ? 'selected' : ''}>Energia</option>
                      <option value="Morte" ${r.elemento === 'Morte' ? 'selected' : ''}>Morte</option>
                      <option value="Sangue" ${r.elemento === 'Sangue' ? 'selected' : ''}>Sangue</option>
                      <option value="Medo" ${r.elemento === 'Medo' ? 'selected' : ''}>Medo</option>
                    </select>
                    <select onchange="atualizarRitual('${idR}', 'circulo', this.value)" class="bg-zinc-900 border border-zinc-800 rounded px-2 py-1 text-xs text-zinc-300">
                      <option value="1º" ${r.circulo === '1º' ? 'selected' : ''}>1º Círculo</option>
                      <option value="2º" ${r.circulo === '2º' ? 'selected' : ''}>2º Círculo</option>
                      <option value="3º" ${r.circulo === '3º' ? 'selected' : ''}>3º Círculo</option>
                      <option value="4º" ${r.circulo === '4º' ? 'selected' : ''}>4º Círculo</option>
                    </select>
                    <div class="flex items-center gap-2">
                      <input type="text" value="${r.pe || ''}" onchange="atualizarRitual('${idR}', 'pe', this.value)" placeholder="PE" class="w-full bg-zinc-900 border border-zinc-800 rounded px-2 py-1 text-xs text-amber-400 font-mono text-center" />
                      <button onclick="removerRitual('${idR}')" class="text-red-500 font-bold px-2 py-1 text-xs">✕</button>
                    </div>
                  </div>
                  <textarea rows="2" onchange="atualizarRitual('${idR}', 'efeito', this.value)" placeholder="Efeito..." class="w-full bg-zinc-900 border border-zinc-800 rounded p-2 text-xs text-zinc-300 font-mono">${r.efeito || ''}</textarea>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="bg-zinc-900 border border-zinc-800 rounded p-4 space-y-4">
            <div class="flex items-center justify-between border-b border-zinc-800 pb-2">
              <h2 class="text-amber-500 font-bold text-sm uppercase">Poderes Paranormais & Habilidades</h2>
              <button onclick="adicionarPoder()" class="bg-amber-600 hover:bg-amber-500 text-black text-xs font-semibold px-2.5 py-1 rounded transition">+ Novo Poder</button>
            </div>
            <div class="space-y-3">
              ${poderesArray.length === 0 ? `
                <div class="text-center py-6 text-zinc-600 text-xs">Nenhum poder registado.</div>
              ` : poderesArray.map(([idP, pod]) => `
                <div class="bg-zinc-950 border border-zinc-800 rounded p-3 space-y-2">
                  <div class="flex items-center gap-2">
                    <input type="text" value="${pod.nome || ''}" onchange="atualizarPoder('${idP}', 'nome', this.value)" placeholder="Nome" class="w-full bg-zinc-900 border border-zinc-800 rounded px-2 py-1 text-xs text-amber-300 font-bold" />
                    <button onclick="removerPoder('${idP}')" class="text-red-500 font-bold px-2 py-1 text-xs">✕</button>
                  </div>
                  <textarea rows="2" onchange="atualizarPoder('${idP}', 'desc', this.value)" placeholder="Descrição..." class="w-full bg-zinc-900 border border-zinc-800 rounded p-2 text-xs text-zinc-400">${pod.desc || ''}</textarea>
                </div>
              `).join('')}
            </div>
          </div>
        </div>

        <!-- ABA DOCUMENTOS -->
        <div class="${abaAtiva === 'documentos' ? 'block' : 'hidden'} space-y-6">
          <div class="bg-zinc-900 border border-cyan-900/60 rounded p-4">
            <div class="flex flex-wrap items-center justify-between border-b border-zinc-800 pb-3 mb-4 gap-3">
              <div>
                <h2 class="text-cyan-400 font-bold uppercase tracking-wide text-base">Arquivo Confidencial — Documentos & Pistas</h2>
                <p class="text-xs text-zinc-400">Relatórios, fotografias e mapas sincronizados.</p>
              </div>
              <label class="bg-cyan-600 hover:bg-cyan-500 text-black font-bold text-xs px-3.5 py-2 rounded transition cursor-pointer flex items-center gap-1.5 shadow">
                <span>⬆️</span> Enviar Documento / Foto
                <input type="file" onchange="fazerUploadDocumento(event)" class="hidden" accept="image/*,.pdf,.txt" />
              </label>
            </div>
            ${chavesDocumentos.length === 0 ? `
              <div class="text-center py-12 text-zinc-600 text-sm">Nenhum documento arquivado.</div>
            ` : `
              <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                ${chavesDocumentos.map(id => {
                  const doc = dadosDocumentos[id];
                  const ehImagem = doc.tipo && doc.tipo.startsWith('image/');
                  return `
                    <div class="bg-zinc-950 border border-cyan-950/70 rounded p-3 flex flex-col justify-between space-y-2">
                      <div>
                        ${ehImagem ? `
                          <div class="h-36 w-full rounded overflow-hidden bg-zinc-900 border border-zinc-800 mb-2 flex items-center justify-center">
                            <img src="${doc.dados}" alt="${doc.nome}" class="h-full w-full object-cover" />
                          </div>
                        ` : `
                          <div class="h-24 w-full rounded bg-zinc-900 border border-zinc-800 mb-2 flex flex-col items-center justify-center text-zinc-500 text-xs font-mono">
                            <span class="text-2xl mb-1">📄</span>
                            <span>ARQUIVO</span>
                          </div>
                        `}
                        <h3 class="font-bold text-xs text-zinc-200 truncate">${doc.nome}</h3>
                        <p class="text-[10px] text-zinc-500 font-mono">${doc.tamanho} • ${doc.dataEnvio || ''}</p>
                      </div>
                      <div class="flex items-center justify-between border-t border-zinc-800/80 pt-2 text-xs">
                        <a href="${doc.dados}" download="${doc.nome}" target="_blank" class="text-cyan-400 hover:text-cyan-300 font-semibold underline text-[11px]">Baixar</a>
                        <button onclick="excluirDocumento('${id}')" class="text-zinc-600 hover:text-red-400 text-[11px]">Excluir</button>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </div>
        </div>

        <!-- ABA MESTRE -->
        <div class="${abaAtiva === 'mestre' ? 'block' : 'hidden'} space-y-6">
          <div class="bg-zinc-900 border border-red-900/60 rounded p-4">
            <div class="flex items-center justify-between border-b border-zinc-800 pb-3 mb-4">
              <h2 class="text-red-500 font-bold uppercase tracking-wide text-base">Escudo do Mestre — Monitoramento em Tempo Real</h2>
              <span class="text-xs font-mono bg-zinc-950 px-3 py-1 rounded text-zinc-400 border border-zinc-800">Agentes: ${chaves.length}</span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              ${chaves.map(id => {

            <div>
              <label class="text-xs text-zinc-400 font-semibold block mb-1">Personalidade</label>
              <textarea rows="3" onchange="atualizarCampo('personalidade', this.value)" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-xs text-zinc-300">${p.personalidade || ''}</textarea>
            </div>
            <div>
              <label class="text-xs text-zinc-400 font-semibold block mb-1">Histórico</label>
              <textarea rows="4" onchange="atualizarCampo('historico', this.value)" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-xs text-zinc-300">${p.historico || ''}</textarea>
            </div>
            <div>
              <label class="text-xs text-zinc-400 font-semibold block mb-1">Objetivo Pessoal</label>
              <textarea rows="4" onchange="atualizarCampo('objetivo', this.value)" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-xs text-zinc-300">${p.objetivo || ''}</textarea>
            </div>
          </div>
        </div>
      `;
    }

    function atualizarCampo(campo, valor) {
      if (!personagemIdAtual) return;
      db.ref(`mesas/${salaAtual}/${personagemIdAtual}/${campo}`).set(valor);
    }
    function atualizarAtributo(attr, valor) {
      if (!personagemIdAtual) return;
      db.ref(`mesas/${salaAtual}/${personagemIdAtual}/atributos/${attr}`).set(valor);
    }
    function atualizarPericia(nomePericia, campo, valor) {
      if (!personagemIdAtual) return;
      db.ref(`mesas/${salaAtual}/${personagemIdAtual}/pericias/${nomePericia}/${campo}`).set(valor);
    }
    function adicionarItem() {
      if (!personagemIdAtual) return;
      db.ref(`mesas/${salaAtual}/${personagemIdAtual}/itens`).push({ nome: "Novo Item", categoria: "0", espacos: 1, detalhes: "" });
    }
    function atualizarItem(idItem, campo, valor) {
      if (!personagemIdAtual) return;
      db.ref(`mesas/${salaAtual}/${personagemIdAtual}/itens/${idItem}/${campo}`).set(valor);
    }
    function removerItem(idItem) {
      if (!personagemIdAtual) return;
      db.ref(`mesas/${salaAtual}/${personagemIdAtual}/itens/${idItem}`).remove();
    }
    function adicionarArma() {
      if (!personagemIdAtual) return;
      db.ref(`mesas/${salaAtual}/${personagemIdAtual}/armas`).push({ nome: "Nova Arma", teste: "Luta", dano: "1d6", critico: "20/x2", alcance: "Curto", especial: "" });
    }
    function atualizarArma(idArma, campo, valor) {
      if (!personagemIdAtual) return;
      db.ref(`mesas/${salaAtual}/${personagemIdAtual}/armas/${idArma}/${campo}`).set(valor);
    }
    function removerArma(idArma) {
      if (!personagemIdAtual) return;
      db.ref(`mesas/${salaAtual}/${personagemIdAtual}/armas/${idArma}`).remove();
    }

    function criarNovoPersonagem(nomePadrao = "Novo Agente") {
      const novoRef = db.ref(`mesas/${salaAtual}`).push();
      novoRef.set({
        nome: nomePadrao,
        origem: "Acadêmico",
        classe: "Ocultista",
        nex: "5%",
        patente: "Recruta",
        credito: "Baixo",
        pvAtual: 12,
        pvMax: 12,
        sanAtual: 20,
        sanMax: 20,
        peAtual: 6,
        peMax: 6,
        defesa: 10,
        atributos: { AGI: 1, FOR: 1, INT: 3, PRE: 2, VIG: 1 },
        rituals: { ritual_1: { nome: "Espirais da Perdição", elemento: "Morte", circulo: "1º", pe: "1", efeito: "Alcance curto." } },
        powers: { power_1: { nome: "Técnica Ocultista", desc: "+2 em Ocultismo." } },
        armas: { arma_1: { nome: "Adaga", teste: "Luta", dano: "1d4", critico: "19/x2", alcance: "Corpo a corpo", especial: "Leve" } },
        itens: { item_1: { nome: "Componentes Ritualísticos", categoria: "I", espacos: 1, detalhes: "Essencial" } },
        aparencia: "", personalidade: "", historico: "", objetivo: ""
      });
      personagemIdAtual = novoRef.key;
    }

    function excluirPersonagemAtual() {
      if (!personagemIdAtual) return;
      const p = dadosSala[personagemIdAtual];
      if (confirm(`Excluir permanentemente o agente "${p ? p.nome : 'atual'}"?`)) {
        db.ref(`mesas/${salaAtual}/${personagemIdAtual}`).remove();
        personagemIdAtual = null;
      }
    }

    ouvirDados();
  </script>
</body>
</html>
