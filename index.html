<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ordo Realitas - Fichas da Mesa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans">

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDFOUP4HtzGXCeKJe_35ejjLVhX49uf2bY",
      authDomain: "ordem-rpg-mesa.firebaseapp.com",
      databaseURL: "https://ordem-rpg-mesa-default-rtdb.firebaseio.com",
      projectId: "ordem-rpg-mesa",
      storageBucket: "ordem-rpg-mesa.firebasestorage.app",
      messagingSenderId: "316057013081",
      appId: "1:316057013081:web:5b912840c0e62f085b5a48"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
  </script>

  <!-- Cabeçalho de Navegação e Salas -->
  <header class="bg-zinc-900 border-b border-zinc-800 p-4 sticky top-0 z-50 shadow-md">
    <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <span class="text-amber-500 font-bold tracking-widest text-lg">ORDO REALITAS</span>
        <div class="flex items-center bg-zinc-950 border border-zinc-700 rounded px-2 py-1 text-sm">
          <span class="text-zinc-500 mr-2 text-xs">SALA:</span>
          <input id="roomInput" type="text" value="novo-nilo" class="bg-transparent font-mono uppercase text-amber-400 focus:outline-none w-28 text-sm" />
          <button onclick="conectarSala()" class="ml-2 text-xs bg-zinc-800 hover:bg-zinc-700 px-2 py-0.5 rounded text-zinc-300">Entrar</button>
        </div>
      </div>

      <div class="flex items-center gap-2 overflow-x-auto" id="personagensBar"></div>

      <button onclick="criarNovoPersonagem()" class="bg-amber-600 hover:bg-amber-500 text-black font-semibold text-xs px-3 py-1.5 rounded transition">
        + Novo Agente
      </button>
    </div>
  </header>

  <!-- Conteúdo Principal da Ficha -->
  <main class="max-w-6xl mx-auto p-4" id="fichaConteudo">
    <div class="text-center py-20 text-zinc-500">A carregar dados da mesa...</div>
  </main>

  <script>
    let salaAtual = "novo-nilo";
    let personagemIdAtual = null;
    let dadosSala = {};

    function conectarSala() {
      const input = document.getElementById("roomInput").value.trim().toLowerCase() || "novo-nilo";
      salaAtual = input;
      ouvirDados();
    }

    function ouvirDados() {
      db.ref("mesas/" + salaAtual).on("value", (snapshot) => {
        dadosSala = snapshot.val() || {};
        const chaves = Object.keys(dadosSala);
        
        if (chaves.length === 0) {
          criarNovoPersonagem("Agente 01");
          return;
        }

        if (!personagemIdAtual || !dadosSala[personagemIdAtual]) {
          personagemIdAtual = chaves[0];
        }

        renderizarBarraPersonagens(chaves);
        renderizarFicha();
      });
    }

    function renderizarBarraPersonagens(chaves) {
      const container = document.getElementById("personagensBar");
      container.innerHTML = "";
      chaves.forEach(id => {
        const p = dadosSala[id];
        const ativo = id === personagemIdAtual;
        const btn = document.createElement("button");
        btn.className = `px-3 py-1 rounded text-xs font-semibold border transition ${
          ativo ? "bg-amber-500 text-black border-amber-400 shadow" : "bg-zinc-800 text-zinc-300 border-zinc-700 hover:bg-zinc-700"
        }`;
        btn.innerText = p.nome || "Sem Nome";
        btn.onclick = () => {
          personagemIdAtual = id;
          renderizarBarraPersonagens(chaves);
          renderizarFicha();
        };
        container.appendChild(btn);
      });
    }

    function renderizarFicha() {
      const p = dadosSala[personagemIdAtual];
      if (!p) return;

      const forca = (p.atributos && p.atributos['FOR']) || 1;
      const cargaMaxima = Math.max(2, forca * 5);
      
      const itensArray = p.itens ? Object.entries(p.itens) : [];
      const cargaAtual = itensArray.reduce((acc, [_, item]) => acc + (parseFloat(item.espacos) || 0), 0);

      const main = document.getElementById("fichaConteudo");
      main.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <!-- Bloco 1: Identificação -->
          <div class="bg-zinc-900 border border-zinc-800 rounded p-4 space-y-3">
            <h2 class="text-amber-500 font-bold border-b border-zinc-800 pb-1 text-sm uppercase">Identificação</h2>
            <div>
              <label class="text-xs text-zinc-500">Nome do Agente</label>
              <input type="text" value="${p.nome || ''}" onchange="atualizarCampo('nome', this.value)" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-sm text-zinc-100" />
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="text-xs text-zinc-500">Classe</label>
                <input type="text" value="${p.classe || 'Combatente'}" onchange="atualizarCampo('classe', this.value)" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-sm" />
              </div>
              <div>
                <label class="text-xs text-zinc-500">NEX (%)</label>
                <input type="text" value="${p.nex || '5%'}" onchange="atualizarCampo('nex', this.value)" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-sm" />
              </div>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="text-xs text-zinc-500">Patente</label>
                <input type="text" value="${p.patente || 'Recruta'}" onchange="atualizarCampo('patente', this.value)" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-sm" />
              </div>
              <div>
                <label class="text-xs text-zinc-500">Limite de Crédito</label>
                <input type="text" value="${p.credito || 'Baixo'}" onchange="atualizarCampo('credito', this.value)" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-sm" />
              </div>
            </div>
          </div>

          <!-- Bloco 2: Pontos Vitais -->
          <div class="bg-zinc-900 border border-zinc-800 rounded p-4 space-y-4">
            <h2 class="text-amber-500 font-bold border-b border-zinc-800 pb-1 text-sm uppercase">Pontos Vitais (Em Tempo Real)</h2>
            <!-- PV -->
            <div>
              <div class="flex justify-between text-xs font-semibold mb-1">
                <span class="text-red-400">PONTOS DE VIDA (PV)</span>
                <span>${p.pvAtual || 0} / ${p.pvMax || 20}</span>
              </div>
              <div class="flex gap-2">
                <input type="number" value="${p.pvAtual || 0}" onchange="atualizarCampo('pvAtual', parseInt(this.value))" class="w-1/2 bg-zinc-950 border border-red-900/50 rounded p-1.5 text-center text-red-300 font-bold text-base" />
                <input type="number" value="${p.pvMax || 20}" onchange="atualizarCampo('pvMax', parseInt(this.value))" class="w-1/2 bg-zinc-950 border border-zinc-800 rounded p-1.5 text-center text-xs text-zinc-400" />
              </div>
            </div>
            <!-- SAN -->
            <div>
              <div class="flex justify-between text-xs font-semibold mb-1">
                <span class="text-blue-400">SANIDADE (SAN)</span>
                <span>${p.sanAtual || 0} / ${p.sanMax || 16}</span>
              </div>
              <div class="flex gap-2">
                <input type="number" value="${p.sanAtual || 0}" onchange="atualizarCampo('sanAtual', parseInt(this.value))" class="w-1/2 bg-zinc-950 border border-blue-900/50 rounded p-1.5 text-center text-blue-300 font-bold text-base" />
                <input type="number" value="${p.sanMax || 16}" onchange="atualizarCampo('sanMax', parseInt(this.value))" class="w-1/2 bg-zinc-950 border border-zinc-800 rounded p-1.5 text-center text-xs text-zinc-400" />
              </div>
            </div>
            <!-- PE -->
            <div>
              <div class="flex justify-between text-xs font-semibold mb-1">
                <span class="text-amber-400">ESFORÇO (PE)</span>
                <span>${p.peAtual || 0} / ${p.peMax || 4}</span>
              </div>
              <div class="flex gap-2">
                <input type="number" value="${p.peAtual || 0}" onchange="atualizarCampo('peAtual', parseInt(this.value))" class="w-1/2 bg-zinc-950 border border-amber-900/50 rounded p-1.5 text-center text-amber-300 font-bold text-base" />
                <input type="number" value="${p.peMax || 4}" onchange="atualizarCampo('peMax', parseInt(this.value))" class="w-1/2 bg-zinc-950 border border-zinc-800 rounded p-1.5 text-center text-xs text-zinc-400" />
              </div>
            </div>
          </div>

          <!-- Bloco 3: Atributos & Defesa -->
          <div class="bg-zinc-900 border border-zinc-800 rounded p-4">
            <h2 class="text-amber-500 font-bold border-b border-zinc-800 pb-1 text-sm uppercase mb-3">Atributos</h2>
            <div class="grid grid-cols-5 gap-1 text-center">
              ${['AGI', 'FOR', 'INT', 'PRE', 'VIG'].map(attr => `
                <div class="bg-zinc-950 p-2 rounded border border-zinc-800">
                  <span class="text-[10px] text-zinc-500 font-bold block">${attr}</span>
                  <input type="number" value="${(p.atributos && p.atributos[attr]) !== undefined ? p.atributos[attr] : 1}" onchange="atualizarAtributo('${attr}', parseInt(this.value))" class="w-full bg-transparent text-center font-bold text-amber-400 text-base focus:outline-none" />
                </div>
              `).join('')}
            </div>
            <div class="mt-4">
              <label class="text-xs text-zinc-500">Defesa Passiva</label>
              <input type="number" value="${p.defesa || 10}" onchange="atualizarCampo('defesa', parseInt(this.value))" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-sm text-center font-bold text-zinc-200" />
            </div>
          </div>

          <!-- Bloco 4: Inventário Detalhado Oficial -->
          <div class="md:col-span-3 bg-zinc-900 border border-zinc-800 rounded p-4 space-y-4">
            <div class="flex flex-wrap items-center justify-between border-b border-zinc-800 pb-2 gap-2">
              <div class="flex items-center gap-3">
                <h2 class="text-amber-500 font-bold text-sm uppercase">Inventário & Carga</h2>
                <span class="text-xs px-2 py-0.5 rounded font-mono ${cargaAtual > cargaMaxima ? 'bg-red-950 text-red-400 border border-red-800' : 'bg-zinc-800 text-zinc-300'}">
                  Carga: ${cargaAtual} / ${cargaMaxima} espaços
                </span>
              </div>
              <button onclick="adicionarItem()" class="bg-amber-600 hover:bg-amber-500 text-black text-xs font-semibold px-2.5 py-1 rounded transition">
                + Adicionar Item
              </button>
            </div>

            <!-- Tabela de Itens -->
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs">
                <thead>
                  <tr class="text-zinc-500 border-b border-zinc-800 font-mono uppercase">
                    <th class="pb-2 w-1/3">Item</th>
                    <th class="pb-2 w-20 text-center">Categoria</th>
                    <th class="pb-2 w-16 text-center">Espaços</th>
                    <th class="pb-2">Detalhes / Descrição</th>
                    <th class="pb-2 w-10 text-center">Ação</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-zinc-800/60">
                  ${itensArray.length === 0 ? `
                    <tr>
                      <td colspan="5" class="py-6 text-center text-zinc-600">Nenhum item adicionado ao inventário deste agente.</td>
                    </tr>
                  ` : itensArray.map(([idItem, item]) => `
                    <tr>
                      <td class="py-2 pr-2">
                        <input type="text" value="${item.nome || ''}" onchange="atualizarItem('${idItem}', 'nome', this.value)" placeholder="Nome do item" class="w-full bg-zinc-950 border border-zinc-800 rounded px-2 py-1 text-zinc-200 font-medium" />
                      </td>
                      <td class="py-2 px-1 text-center">
                        <select onchange="atualizarItem('${idItem}', 'categoria', this.value)" class="bg-zinc-950 border border-zinc-800 rounded px-1.5 py-1 text-zinc-300 w-full text-center">
                          <option value="0" ${item.categoria == '0' ? 'selected' : ''}>0</option>
                          <option value="I" ${item.categoria == 'I' ? 'selected' : ''}>I</option>
                          <option value="II" ${item.categoria == 'II' ? 'selected' : ''}>II</option>
                          <option value="III" ${item.categoria == 'III' ? 'selected' : ''}>III</option>
                          <option value="IV" ${item.categoria == 'IV' ? 'selected' : ''}>IV</option>
                        </select>
                      </td>
                      <td class="py-2 px-1 text-center">
                        <input type="number" step="0.5" value="${item.espacos !== undefined ? item.espacos : 1}" onchange="atualizarItem('${idItem}', 'espacos', parseFloat(this.value) || 0)" class="w-full bg-zinc-950 border border-zinc-800 rounded px-1.5 py-1 text-center text-zinc-200" />
                      </td>
                      <td class="py-2 px-2">
                        <input type="text" value="${item.detalhes || ''}" onchange="atualizarItem('${idItem}', 'detalhes', this.value)" placeholder="Dano, munição, efeitos..." class="w-full bg-zinc-950 border border-zinc-800 rounded px-2 py-1 text-zinc-400" />
                      </td>
                      <td class="py-2 text-center">
                        <button onclick="removerItem('${idItem}')" class="text-red-500 hover:text-red-400 font-bold px-2 py-1">✕</button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function atualizarCampo(campo, valor) {
      if (!personagemIdAtual) return;
      db.ref(`mesas/${salaAtual}/${personagemIdAtual}/${campo}`).set(valor);
    }

    function atualizarAtributo(attr, valor) {
      if (!personagemIdAtual) return;
      db.ref(`mesas/${salaAtual}/${personagemIdAtual}/atributos/${attr}`).set(valor);
    }

    function adicionarItem() {
      if (!personagemIdAtual) return;
      const novoItemRef = db.ref(`mesas/${salaAtual}/${personagemIdAtual}/itens`).push();
      novoItemRef.set({
        nome: "Novo Item",
        categoria: "0",
        espacos: 1,
        detalhes: ""
      });
    }

    function atualizarItem(idItem, campo, valor) {
      if (!personagemIdAtual) return;
      db.ref(`mesas/${salaAtual}/${personagemIdAtual}/itens/${idItem}/${campo}`).set(valor);
    }

    function removerItem(idItem) {
      if (!personagemIdAtual) return;
      db.ref(`mesas/${salaAtual}/${personagemIdAtual}/itens/${idItem}`).remove();
    }

    function criarNovoPersonagem(nomePadrao = "Novo Agente") {
      const novoRef = db.ref(`mesas/${salaAtual}`).push();
      const itensIniciais = {
        item_1: { nome: "Revólver .38", categoria: "I", espacos: 1, detalhes: "Dano: 2d6, Bala Curta" },
        item_2: { nome: "Munição Curta (2x)", categoria: "I", espacos: 1, detalhes: "Recarga" },
        item_3: { nome: "Lanterna Tática", categoria: "0", espacos: 1, detalhes: "Ilumina alcance curto" }
      };

      novoRef.set({
        nome: nomePadrao,
        classe: "Combatente",
        nex: "5%",
        patente: "Recruta",
        credito: "Baixo",
        pvAtual: 20,
        pvMax: 20,
        sanAtual: 16,
        sanMax: 16,
        peAtual: 2,
        peMax: 2,
        defesa: 11,
        atributos: { AGI: 2, FOR: 2, INT: 1, PRE: 1, VIG: 2 },
        itens: itensIniciais
      });
      personagemIdAtual = novoRef.key;
    }

    ouvirDados();
  </script>
</body>
</html>
